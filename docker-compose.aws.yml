# 상용(AWS) 서버 /opt/wjbid/app/docker-compose.yml 의 정본. deploy_aws.sh 가 이 파일을 올린다.
# 서버에서 직접 고치면 다음 배포에 덮이므로 바꿀 것은 여기서 고친다. 비밀값은 서버 .env 에만 둔다.
name: bidding-agency
services:
  bidding-agency:
    image: eclipse-temurin:17-jre-alpine
    platform: linux/amd64
    restart: unless-stopped
    # Aimbase 가 컨테이너 안에서 host.docker.internal:8183 으로 이 앱의 /api/mcp 를 부른다.
    ports: ["127.0.0.1:8183:8080", "172.17.0.1:8183:8080"]
    volumes:
      - ./bidding-agency.jar:/app/app.jar
      - ./logs:/app/logs
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["java", "-Dfile.encoding=UTF-8", "-jar", "/app/app.jar"]
    env_file: .env
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.timezone=Asia/Seoul"
      SERVER_PORT: 8080
      DB_URL: "jdbc:mysql://host.docker.internal:3306/bidding_agency?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: bidding
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      AIMBASE_URL: http://host.docker.internal:8280
      SELF_BASE_URL: http://host.docker.internal:8183/api
      APP_CORS_ALLOWED_ORIGINS: https://woojinusbid.com,http://woojinusbid.com
      # CR-148: 위젯 토큰의 origin. 화면이 https 라 Aimbase widget.allowed-origins 와 함께 https 로 맞춘다.
      WIDGET_ALLOWED_ORIGIN: https://woojinusbid.com
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      AIMBASE_WF_OPP_ANALYSIS: opportunity-analysis
      STORAGE_LOCAL_DIR: /app/storage/rfp-samples
      AIMBASE_WF_PROPOSAL_DESIGN: proposal-design
      AIMBASE_WF_PROPOSAL_WRITE_SECTION: proposal-write-section
      AIMBASE_WF_PROPOSAL_ASSEMBLE: proposal-assemble
