# 운영 서버 54.116.150.247(AWS) /etc/nginx/sites-available/woojinusbid 기록본 (CR-138, 2026-10-12 00:18)
# 관리자 경로의 넘김 주소를 /admin/index.html 로 고쳤다. 고치기 전 설정은 서버의 woojinusbid.bak-pre-cr138
# 옛 서버 59.8.160.12 에는 적용하지 않았다(10/11 운영 이전으로 쓰지 않음)
server {
    server_name woojinusbid.com www.woojinusbid.com _;

    location /admin/ {
        alias /opt/wjbid/app/admin-console/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100M;
    }
    location /api/mcp/sse {
        proxy_pass http://127.0.0.1:8183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    # CR-148: 관리자 공고문 수정 채팅(Aimbase 위젯)이 쓰는 파일과 채팅 경로만 같은 주소로 넘긴다.
    # Aimbase 관리 기능은 밖에 열지 않는다.
    location /aimbase/ {
        return 404;
    }
    location /aimbase/widget/ {
        proxy_pass http://127.0.0.1:8280/widget/;
    }
    location ~ ^/aimbase/api/v1/(chat/|workflows/runs/[^/]+/subscribe|knowledge-sources/[^/]+/chunks/) {
        rewrite ^/aimbase(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 30M;
    }
    location / {
        root /opt/wjbid/app/customer-portal;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/woojinusbid.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/woojinusbid.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.woojinusbid.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = woojinusbid.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name woojinusbid.com www.woojinusbid.com _;
    return 404; # managed by Certbot




}