# 운영 서버 59.8.160.12 /etc/nginx/sites-available/woojinusbid 기록본 (CR-138, 2026-10-11)
# 관리자 경로의 넘김 주소를 /admin/index.html 로 고쳤다. 고치기 전 설정은 서버의 woojinusbid.bak.cr138-20261011
server {
    listen 80;
    server_name woojinusbid.com www.woojinusbid.com;

    # SSL 설정 (선택사항)
    # listen 443 ssl;
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # Admin Console (/admin/)
    location /admin/ {
        alias /home/therecommerce/bidding-agency/admin-console/;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }


    # 백엔드 API 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:8183;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE 지원 (MCP SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 파일 업로드 크기 제한
        client_max_body_size 100M;
    }

    # MCP SSE 엔드포인트 (장시간 연결)
    location /api/mcp/sse {
        proxy_pass http://127.0.0.1:8183;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Customer Portal (메인 사이트)
    location / {
        root /home/therecommerce/bidding-agency/customer-portal;
        try_files $uri $uri/ /index.html;
    }
}

